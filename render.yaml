services:
  - type: web
    name: budgeting-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: budgeting-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      # Set after the frontend is deployed to Vercel — a JSON array of
      # allowed origins, e.g. ["https://your-app.vercel.app"].
      - key: CORS_ORIGINS
        sync: false
      # Used only when manually running `python -m scripts.seed_owner`
      # from the Render shell after the first deploy — see README.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false

databases:
  - name: budgeting-db
    plan: free
